<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Змейка</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #0e2a2f; color: #e8f3f1;
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { text-align: center; padding: 16px; }
  h1 { margin: 0 0 4px; font-size: 24px; }
  #score { margin: 0 0 12px; color: #8fb0b0; }
  canvas {
    display: block; margin: 0 auto; max-width: 100%;
    background: #14363c; border: 2px solid #24505a; border-radius: 10px;
    touch-action: none;
  }
  button {
    margin-top: 14px; padding: 10px 20px; font: 700 15px inherit;
    background: #ff9f43; color: #2b1600; border: 0; border-radius: 8px; cursor: pointer;
  }
  button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  p.hint { color: #8fb0b0; font-size: 14px; margin: 10px 0 0; }
</style>
</head>
<body>
<main>
  <h1>Змейка</h1>
  <p id="score">Счёт: 0 · Рекорд: 0</p>
  <canvas id="c" width="360" height="360"></canvas>
  <button id="btn">Начать игру</button>
  <p class="hint">Управление: стрелки или WASD. На телефоне — свайпы.</p>
</main>

<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const N = 18, S = cv.width / N;
let snake, dir, next, food, score, best = 0, timer = null;

function place() {
  do { food = { x: Math.random() * N | 0, y: Math.random() * N | 0 }; }
  while (snake.some(s => s.x === food.x && s.y === food.y));
}

function start() {
  snake = [{ x: 9, y: 9 }, { x: 8, y: 9 }, { x: 7, y: 9 }];
  dir = next = { x: 1, y: 0 };
  score = 0;
  place(); updateScore(); draw();
  clearInterval(timer);
  timer = setInterval(tick, 120);
  document.getElementById('btn').textContent = 'Начать заново';
}

function updateScore() {
  document.getElementById('score').textContent = `Счёт: ${score} · Рекорд: ${best}`;
}

function tick() {
  dir = next;
  const h = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
  const hit = h.x < 0 || h.y < 0 || h.x >= N || h.y >= N || snake.some(s => s.x === h.x && s.y === h.y);
  if (hit) return end();
  snake.unshift(h);
  if (h.x === food.x && h.y === food.y) { score++; best = Math.max(best, score); place(); updateScore(); }
  else snake.pop();
  draw();
}

function end() {
  clearInterval(timer); timer = null;
  draw();
  ctx.fillStyle = 'rgba(14,42,47,.8)'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = '#e8f3f1'; ctx.textAlign = 'center';
  ctx.font = '700 28px system-ui, sans-serif'; ctx.fillText('Игра окончена', cv.width / 2, cv.height / 2 - 6);
  ctx.font = '16px system-ui, sans-serif'; ctx.fillText('Счёт: ' + score, cv.width / 2, cv.height / 2 + 22);
}

function draw() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = '#ff6b6b';
  ctx.beginPath(); ctx.arc(food.x * S + S / 2, food.y * S + S / 2, S / 2 - 3, 0, 7); ctx.fill();
  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? '#ff9f43' : '#5fd3a0';
    ctx.fillRect(s.x * S + 1, s.y * S + 1, S - 2, S - 2);
  });
}

function turn(x, y) {
  if (x === -dir.x && y === -dir.y) return;
  next = { x, y };
}

const keys = {
  ArrowUp: [0, -1], w: [0, -1], ArrowDown: [0, 1], s: [0, 1],
  ArrowLeft: [-1, 0], a: [-1, 0], ArrowRight: [1, 0], d: [1, 0]
};
addEventListener('keydown', e => {
  const k = keys[e.key] || keys[e.key.toLowerCase()];
  if (k) { e.preventDefault(); turn(...k); }
});

let t0;
cv.addEventListener('touchstart', e => { t0 = e.touches[0]; });
cv.addEventListener('touchend', e => {
  if (!t0) return;
  const dx = e.changedTouches[0].clientX - t0.clientX, dy = e.changedTouches[0].clientY - t0.clientY;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
  if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0); else turn(0, dy > 0 ? 1 : -1);
});

document.getElementById('btn').onclick = start;
snake = [{ x: 9, y: 9 }]; place(); draw();
</script>
</body>
</html>
